name: CI quality gate Slack

# Runs with the default-branch implementation and secrets after a monitored PR
# or main workflow finishes. Never check out or execute untrusted PR code here.
on:
  workflow_run:
    workflows:
      - DCO Check
      - CodeQL
      - OSS Guards
      - PR Checks
      - Release
      - 📚 Docs (build check)
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  notify:
    if: >-
      github.event.workflow_run.pull_requests[0].number != null ||
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted notification code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Notify Slack about the CI quality gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITORED_WORKFLOWS: '["DCO Check","OSS Guards","PR Checks"]'
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID_CICD: ${{ secrets.SLACK_CHANNEL_ID_CICD }}
          SOURCE_ACTOR: ${{ github.event.workflow_run.actor.login }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: node scripts/autonomy/notify-pr-ci-slack.mjs
