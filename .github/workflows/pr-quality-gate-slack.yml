name: PR quality gate Slack

# Runs with the default-branch implementation and secrets only after an
# unprivileged PR workflow finishes. Never check out or execute PR code here.
on:
  workflow_run:
    workflows:
      - DCO Check
      - OSS Guards
      - PR Checks
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  notify:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted notification code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Notify Slack about the aggregate PR quality gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITORED_WORKFLOWS: '["DCO Check","OSS Guards","PR Checks"]'
          PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID_CICD: ${{ secrets.SLACK_CHANNEL_ID_CICD }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: node scripts/autonomy/notify-pr-ci-slack.mjs
