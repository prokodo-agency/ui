name: Release

# Bump commits release automatically; an administrator may resume the exact
# current version from main after a release-workflow repair, without another bump.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Exact existing package.json version to release from main
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: ui-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── 1 ─────────────────────────────────────────────────────────────────────
  # Test, build and publish the library to npmjs.com.
  # ────────────────────────────────────────────────────────────────────────────
  publish-npm:
    name: Publish — npmjs.com
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release):'))
    permissions:
      contents: read
      id-token: write

    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 💿 Setup pnpm (v9)
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: 🧰 Setup Node.js (v22) & npm registry cache
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org/"
          cache: pnpm

      - name: ⬆️ Upgrade npm to latest
        # Two-step upgrade: npm 10.9.7 (Node 22.22.2) crashes on direct
        # @latest due to missing promise-retry — see npm/cli#9151
        run: npm i -g npm@10.9.8 && npm i -g npm@latest

      - name: Validate exact release request
        env:
          CI_RELEASE_EVENT: ${{ github.event_name }}
          CI_RELEASE_REF: ${{ github.ref }}
          CI_RELEASE_VERSION: ${{ inputs.version }}
          CI_RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: >-
          node scripts/autonomy/verify-release-request.mjs
          "$CI_RELEASE_EVENT" "$CI_RELEASE_REF"
          "$CI_RELEASE_VERSION" "$CI_RELEASE_MESSAGE"

      - name: 📦 Cache Cypress binary
        id: cypress-cache
        uses: actions/cache@v4
        with:
          path: .cache/Cypress
          key: cypress-repository-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: 📥 Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: 🔧 Install Cypress binary
        run: pnpm cypress:install

      - name: Verify repository-local Cypress binary
        run: pnpm cypress:verify

      - name: Validate release and engineering contracts
        run: pnpm test:autonomy

      - name: 🧪 Typecheck, Lint & Test
        run: pnpm run test:ci

      - name: 🛠 Build library (production)
        run: pnpm run build

      - name: 🔖 Read version from package.json
        id: ver
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}"    >> "$GITHUB_OUTPUT"

      - name: ✅ Assert semver format
        shell: bash
        run: |
          VER=${{ steps.ver.outputs.version }}
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ version is not semver (X.Y.Z): ${VER}" >&2; exit 1
          fi
          echo "✅ Version: ${VER}"

      - name: 🔍 Check whether version already exists on npm
        id: npm-check
        env:
          CI_RELEASE_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=${{ steps.ver.outputs.version }}
          if npm view "${NAME}@${VER}" version \
               --registry https://registry.npmjs.org >/dev/null 2>&1; then
            if [ "$CI_RELEASE_EVENT" = "workflow_dispatch" ]; then
              echo "::error::Manual recovery requires an unpublished version; resume failed post-publication jobs from their original run instead."
              exit 1
            fi
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Publish to npmjs.com (OIDC provenance, public access)
        if: steps.npm-check.outputs.exists != 'true'
        run: npm publish --access public

  # ─── 2 ─────────────────────────────────────────────────────────────────────
  # Create git tag and GitHub Release after npm publish succeeds.
  # ────────────────────────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish-npm
    if: github.ref == 'refs/heads/main' && needs.publish-npm.result == 'success'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🏷 Create and push git tag
        shell: bash
        run: |
          TAG="${{ needs.publish-npm.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "ℹ️  Tag ${TAG} already exists — skipping"
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: 📢 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.publish-npm.outputs.tag }}
          name: ${{ needs.publish-npm.outputs.tag }}
          generate_release_notes: true
          make_latest: true

  # ─── 3 ─────────────────────────────────────────────────────────────────────
  # Build Storybook + Docusaurus and deploy to GitHub Pages.
  # Waits for publish-npm so docs only deploy on a successful release.
  # ────────────────────────────────────────────────────────────────────────────
  deploy-site:
    name: Deploy docs + Storybook → ui.prokodo.com
    runs-on: ubuntu-latest
    needs: publish-npm
    if: github.ref == 'refs/heads/main' && needs.publish-npm.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 💿 Setup pnpm (v9)
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: 🧰 Setup Node.js (v22)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 📥 Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: 🏗 Build library
        run: pnpm build

      - name: 📘 Build Storybook (static export)
        run: pnpm run storybook:build

      - name: 📝 Generate docs component overview
        run: cd docs && node scripts/generate-overview.mjs

      - name: 📚 Build Docusaurus docs
        run: cd docs && pnpm build

      - name: 🧱 Assemble Pages site (docs root + storybook subpath)
        shell: bash
        run: |
          rm -rf site
          mkdir -p site/storybook

          # Docs become the primary site at ui.prokodo.com
          cp -R docs/build/. site/

          # Storybook is served under /storybook
          cp -R storybook-static/. site/storybook/

          # Custom domain for GitHub Pages
          echo 'ui.prokodo.com' > site/CNAME

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: 🌐 Deploy to GitHub Pages (ui.prokodo.com)
        id: deployment
        uses: actions/deploy-pages@v4
